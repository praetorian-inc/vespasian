name: Verify Pins
# Fails CI if any first-party praetorian-inc/public-workflows `uses:` pin carries a
# dishonest version comment (missing tag, nonexistent tag, or SHA != that tag).
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    uses: praetorian-inc/public-workflows/.github/workflows/verify-pins.yml@2cce562404572f0e8004fc0fa1ad91a62a41592f  # v2.19.0
    permissions:
      contents: read
