name: Verify Pins
# Fails CI if any first-party praetorian-inc/public-workflows `uses:` pin carries a
# dishonest version comment (missing tag, nonexistent tag, or SHA != that tag).
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    uses: praetorian-inc/public-workflows/.github/workflows/verify-pins.yml@96b68220af4797b2bfe5be07183f6190f739e424  # v2.16.13
    permissions:
      contents: read
