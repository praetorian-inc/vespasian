name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC — weekly baseline
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: praetorian-inc/public-workflows/.github/workflows/go-sec.yml@0c602372f3d0d038912dd08e159ecc83954a4995  # v2.9.3
    permissions:
      contents: read
      pull-requests: read     # go-sec.yml preflight reads PR files + repo tree
      security-events: write
      actions: read           # required by codeql-action/upload-sarif for run metadata
    with:
      # Skip machine-generated files (those carrying the standard
      # `// Code generated ... DO NOT EDIT.` marker, e.g. test/grpc-server/labpb/*.pb.go).
      # Their unsafe.Pointer fast-paths are protoc-gen-go boilerplate, not
      # hand-written code, so gosec's G103 "audit unsafe" alerts on them are
      # noise. Mirrors golangci-lint's `exclusions.generated: lax`. The rest of
      # the args match the reusable workflow's default (observe-only + SARIF).
      gosec-args: "-no-fail -exclude-generated -fmt sarif -out gosec-results.sarif ./..."
      # Override the reusable workflow's v2.22.11 default, which links
      # golang.org/x/tools v0.39.0 and cannot read go1.27 export data. The gosec
      # job runs `go-version: stable`, so when go1.27.0 became stable on
      # 2026-08-20 every scan died before writing SARIF with
      # `internal error: package "<stdlib pkg>" without types was imported from
      # "command-line-arguments"` (the named package varies by run).
      # v2.28.0 links x/tools v0.48.0, which reads it. Measured against this
      # module: v2.22.11+go1.26.3 exit 0 / 21 findings, v2.22.11+go1.27.0 exit 1
      # / no SARIF, v2.28.0+go1.27.0 exit 0 / 30 findings.
      # Pin, never `latest`: a gosec release can require a newer Go than the
      # runner provides. Re-pin when a future Go stable outruns x/tools v0.48.0.
      gosec-version: "v2.28.0"
      # Same failure class as gosec above, second tool. The reusable workflow's
      # v1.1.4 default links golang.org/x/tools v0.29.0 (go.mod `go 1.22.0`) and
      # panics `unexpected expr: *ast.KeyValueExpr` on go1.27, exiting 2 with no
      # SARIF. Intermittent, ~50%: seen in runs 32382788588 and 32488363549,
      # absent from 32395398753 and 32398238149, and never observed before
      # go1.27.0 became stable. v1.7.0 links x/tools v0.49.0, the release that
      # carries go1.27 support.
      govulncheck-version: "v1.7.0"
    secrets: inherit
