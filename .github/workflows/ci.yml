name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@0c602372f3d0d038912dd08e159ecc83954a4995  # v2.9.3
    permissions:
      contents: read
    with:
      build-cmd-path: ./cmd/vespasian
      build-binary-name: vespasian
      build-cgo-enabled: "1"
      build-matrix-os: '["linux"]'
      build-matrix-arch: '["amd64"]'
    secrets: inherit

  # Fails when a comment changed by this PR guarantees a state cannot occur without
  # naming the test that pins it. See scripts/check-unreachability-claims.sh for the
  # three LAB-4678 defects where a confident paragraph stood in for a verified claim
  # and survived four rounds of human review.
  #
  # A separate job rather than a step in `ci` above: that job delegates to a shared
  # reusable workflow which accepts only build-* inputs, so it cannot run a repo
  # script. Separate also keeps a comment failure visually distinct from a build or
  # lint failure.
  comment-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          # Full history: the check diffs against the base ref, and the default
          # depth-1 checkout has no merge base to diff against. Without this it
          # would fall back to sweeping every file and fail on pre-existing claims,
          # turning a ratchet into a blanket gate.
          fetch-depth: 0

      - name: Check unreachability claims cite a test
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "${BASE_REF#origin/}"
          make lint-comments
