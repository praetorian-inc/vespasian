name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      # The two patterns above are root-scoped, so the nested proto-validate
      # module's own manifests would not otherwise trigger CI.
      - 'test/proto-validate/go.mod'
      - 'test/proto-validate/go.sum'
      - '.golangci*'
      - 'Makefile'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@0c602372f3d0d038912dd08e159ecc83954a4995  # v2.9.3
    permissions:
      contents: read
    with:
      golangci-lint-version: "v2.13.1"
      build-cmd-path: ./cmd/vespasian
      build-binary-name: vespasian
      build-cgo-enabled: "1"
      build-matrix-os: '["linux"]'
      build-matrix-arch: '["amd64"]'
    secrets: inherit

  # test/proto-validate is its own module (see test/proto-validate/go.mod), so
  # protocompile stays out of the shipped module's require list and downstream
  # pkg/sdk consumers no longer resolve it. The cost of that split is that the
  # nested module's packages are NOT matched by a root `go test ./...` — verified,
  # not assumed — so without this job the AC4 helper's unit tests would silently
  # stop running, which is precisely the never-executed-assertion failure
  # LAB-5549 exists to remove.
  #
  # A separate job rather than an input to `ci` above, for the same reason
  # comment-claims is one: that job delegates to a shared reusable workflow which
  # accepts only build-* inputs, so it cannot be told about a second module.
  #
  # Enters the module with working-directory rather than naming a root-relative
  # path: there is deliberately no go.work (a workspace would couple the product's
  # dependency resolution to this helper's manifest), and without one a
  # root-relative module pattern does not resolve. Same form as `make test`.
  proto-validate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod

      - name: Vet test/proto-validate (nested module)
        working-directory: test/proto-validate
        run: go vet ./...

      - name: Test test/proto-validate (nested module)
        working-directory: test/proto-validate
        run: go test -race ./...

  # Fails when a comment changed by this PR guarantees a state cannot occur without
  # naming the test that pins it. See scripts/check-unreachability-claims.sh for the
  # three LAB-4678 defects where a confident paragraph stood in for a verified claim
  # and survived four rounds of human review.
  #
  # A separate job rather than a step in `ci` above: that job delegates to a shared
  # reusable workflow which accepts only build-* inputs, so it cannot run a repo
  # script. Separate also keeps a comment failure visually distinct from a build or
  # lint failure.
  comment-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          # Full history: the check diffs against the base ref, and the default
          # depth-1 checkout has no merge base to diff against. Without this it
          # would fall back to sweeping every file and fail on pre-existing claims,
          # turning a ratchet into a blanket gate.
          fetch-depth: 0

      # Runs BEFORE the checker itself, deliberately. It is the only thing that
      # exercises the checker on Linux: the script is authored on macOS, and the
      # two userlands disagree in both directions (`mktemp -t NAME` is a BSD
      # prefix but a GNU template; `awk -v` tolerates newlines on GNU and not on
      # BSD), so a local green says nothing about this runner. A broken checker
      # then reports as a checker bug here rather than as claim violations below,
      # or as the silent pass that a shape-only citation match used to give.
      - name: Self-test the claims checker
        run: ./scripts/check-unreachability-claims_test.sh

      - name: Check unreachability claims cite a test
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "${BASE_REF#origin/}"
          make lint-comments

  # LAB-5331: local coverage gate. The reusable go-ci.yml (the `ci` job) produces a
  # coverage profile but never enforces a threshold, so this sibling job runs
  # `make coverage-gate`, which fails the build when total statement coverage drops
  # below COVERAGE_THRESHOLD (Makefile). No third-party service, token, or new egress.
  coverage-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Defense-in-depth (LAB-4732 / SEC-BE-002): monitor/record outbound
      # traffic. Audit mode is non-blocking. Egress observed in this job's audit
      # run: api.github.com plus results-receiver.actions.githubusercontent.com,
      # release-assets.githubusercontent.com and productionresultssa6.blob.core.windows.net
      # (checkout, setup-go, and Actions runner infrastructure), and example.com,
      # which cmd/vespasian/main_test.go probes with Probe:true under `-race`.
      # go.mod-driven module fetches (proxy.golang.org) may also appear on a cache
      # miss. This list is the artifact LAB-4732's audit->block work will read, so
      # keep it matched to the run's `endpoint called` log lines.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
      # Runs BEFORE the gate itself, deliberately -- the same reasoning as the
      # "Self-test the claims checker" step above. The gate's awk one-liner is
      # authored on macOS and first runs for real here on ubuntu, and it already
      # shipped one false-green bug (a non-numeric threshold coerced to 0 still
      # printed PASS). This exercises each documented exit code against fixtures
      # so a fail-open regression in the one-liner reports as a self-test failure
      # here rather than as a silently green gate below. No Go build (make -n).
      - name: Self-test the coverage gate
        run: ./scripts/coverage-gate_test.sh
      # `make coverage` runs the suite under -race, which requires CGO + a C
      # compiler; ubuntu-latest ships gcc. The profile excludes test/.
      - name: Enforce coverage threshold
        env:
          CGO_ENABLED: "1"
        run: make coverage-gate
